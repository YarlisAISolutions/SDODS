# Read-only load profile for `sdods load`. The staging environment points at a public sandbox
# (JSONPlaceholder) and deliberately does NOT opt in to load, so only `--dry-run` works against it.
description: Read posts and one post's comments
thinkTimeSeconds: 1
vus: 2
duration: 20s
thresholds:
  http_req_duration: ['p(95)<1500']
  http_req_failed: ['rate<0.01']
  checks: ['rate>0.99']
requests:
  - name: list posts
    path: /posts
    expect: { status: 200, bodyContains: userId }
  - name: post comments
    path: /posts/1/comments
    expect: { status: 200 }
