# Workshop project for the SDODS documentation — see /docs/workshop.
# Generated by `sdods analyze ../cypress-realworld-app --apply`; the routes, modules and auth
# selectors below were reviewed by hand afterwards, which is exactly what the workshop teaches.
slug: rwa-bank
name: RWA Bank
description: Workshop project. Generated by `sdods analyze` from cypress-io/cypress-realworld-app
  (Express, React Router, React, Vite), then corrected by hand where the analyzer had to guess.
layers:
- ui
- api
- hybrid
browsers:
- chromium
testIdAttribute: data-test
routes:
  home: /
  contacts: /contacts
  personal: /personal
  signin: /signin
  signup: /signup
tags:
  suites:
  - smoke
  - regression
  - sanity
  extra:
  - contract
  - visual
  - a11y
  roles:
  - standard
  - admin
envs:
  default: local
  available:
  - local
modules:
- name: account
  path: account
  layers:
  - ui
  - hybrid
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@account'
  routes:
  - home
- name: session
  path: session
  layers:
  - api
  testingTypes:
  - functional
  - regression
  tags:
  - '@session'
  endpoints:
  - /login
  - /users/profile/{username}
- name: contacts
  path: contacts
  layers:
  - ui
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@contacts'
  routes:
  - contacts
- name: personal
  path: personal
  layers:
  - ui
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@personal'
  routes:
  - personal
- name: signin
  path: signin
  layers:
  - ui
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@signin'
  routes:
  - signin
- name: signup
  path: signup
  layers:
  - ui
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@signup'
  routes:
  - signup
- name: home
  path: home
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@home'
  endpoints:
  - /
  - /{entity}
  - /{username}
- name: checkauth
  path: checkauth
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  - data-driven
  tags:
  - '@checkauth'
  endpoints:
  - /checkAuth
- name: login
  path: login
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@login'
  endpoints:
  - /login
- name: logout
  path: logout
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@logout'
  endpoints:
  - /logout
- name: profile
  path: profile
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@profile'
  endpoints:
  - /profile/{username}
- name: search
  path: search
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@search'
  endpoints:
  - /search
- name: seed
  path: seed
  layers:
  - api
  testingTypes:
  - functional
  - smoke
  - regression
  tags:
  - '@seed'
  endpoints:
  - /seed
processes:
- name: pr-check
  trigger: pr
  tags: '@smoke'
  browsers:
  - chromium
  gates:
    minPassRate: 100
- name: nightly-regression
  trigger: nightly
  tags: '@regression'
data:
  sources:
    users:
      type: csv
      path: data/{env}/users.csv
      fallback: data/common/users.csv
  userPool:
    dataset: users
    roleColumn: role
    leaseStore: file
auth:
  strategy: form
  storageState: true
  form:
    loginPath: /signin
    usernameSelector: '[data-test="signin-username"] input'
    passwordSelector: '[data-test="signin-password"] input'
    submitSelector: '[data-test="signin-submit"]'
    readyUrl: /
screenshots:
  policy:
    default: on-failure
    '@smoke': scenario
    '@regression': step
    '@visual': visual
  viewport:
    width: 1280
    height: 720
heal:
  enabled: true
retries:
  ci: 2
  local: 0
