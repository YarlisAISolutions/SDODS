name: Bug report
description: Something in AutoMax does not behave as documented.
title: '[Bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Please include the output of `automax doctor --json` (secrets are never printed) and the run id when a run is involved.
  - type: input
    id: automax-version
    attributes:
      label: AutoMax version
      description: '`automax --version`'
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: automax doctor --json
      render: json
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: 'automax run -p demo-shop -e staging -l ui -b chromium -t @smoke'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual (error text, exit code)
      render: text
    validations:
      required: true
  - type: input
    id: run-id
    attributes:
      label: Run id
      description: Printed by `automax run`; artifacts live under `.automax/runs/<runId>/`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or run.log excerpt
      render: text
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
  - type: dropdown
    id: browser
    attributes:
      label: Browser (if UI)
      options: [chromium, firefox, webkit, mobile-chrome, mobile-safari, n/a]
