name: docs

# Builds the Fumadocs site (apps/docs) and deploys it to Firebase Hosting.
# - push to main → live channel at https://docs.sdods.com
# - pull request  → temporary preview channel (URL posted on the PR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/roadmap/**'
      - 'packages/contracts/**'
      - 'packages/cli/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/roadmap/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/docs.yml'
      - 'scripts/preview-quota-gate.sh'
  # The roadmap reads the calendar at build time (packages/roadmap/src/calendar.ts), so a monthly
  # rebuild moves "today" and flags overdue stops without anyone editing the page.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Verify executable examples
        run: bun run docs:verify
      - name: Build (root base path for docs.sdods.com)
        run: bun run docs:build
        env:
          NEXT_PUBLIC_SITE_URL: https://docs.sdods.com
          # Maxi, the docs assistant; empty until the MAXI_URL repository variable is set.
          NEXT_PUBLIC_MAXI_URL: ${{ vars.MAXI_URL }}
          # Whether the source repository is public: shows the GitHub buttons, Discussions and
          # prefilled issue forms (apps/*/lib/links.ts). A repository variable, so making the repo
          # private again is `gh variable set REPO_PUBLIC --body false` and a rebuild, not a code change.
          NEXT_PUBLIC_REPO_PUBLIC: ${{ vars.REPO_PUBLIC }}
      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: apps/docs/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: apps/docs/out
      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: docs
          channelId: live
      # previews.yml deletes the channel when the PR closes; `expires` is the backstop. The quota
      # gate below decides whether a failure here fails the job.
      - name: Deploy to Firebase Hosting (preview)
        id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: docs
          channelId: pr-${{ github.event.number }}
          expires: 3d
      - name: Tolerate a full channel quota, and nothing else
        if: steps.preview.outcome == 'failure'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          SITE: automax-docs
          CHANNEL: pr-${{ github.event.number }}
        run: bash scripts/preview-quota-gate.sh
