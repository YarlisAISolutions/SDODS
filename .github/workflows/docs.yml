name: docs

# Builds the Fumadocs site (apps/docs) and deploys it to Firebase Hosting.
# - push to main → live channel at https://docs.sdods.com
# - pull request  → temporary preview channel (URL posted on the PR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/contracts/**'
      - 'packages/cli/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Verify executable examples
        run: bun run docs:verify
      - name: Build (root base path for docs.sdods.com)
        run: bun run docs:build
        env:
          NEXT_PUBLIC_SITE_URL: https://docs.sdods.com
          # Maxi, the docs assistant; empty until the MAXI_URL repository variable is set.
          NEXT_PUBLIC_MAXI_URL: ${{ vars.MAXI_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: apps/docs/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: apps/docs/out
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: docs
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'live' }}
          expires: 7d
