name: www

# Builds the landing site (apps/www) and deploys it to Firebase Hosting.
# - push to main → live channel at https://sdods.com and https://www.sdods.com
# - pull request  → temporary preview channel (URL posted on the PR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'packages/roadmap/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
  pull_request:
    paths:
      - 'apps/www/**'
      - 'packages/roadmap/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
      - 'scripts/preview-quota-gate.sh'
  # The roadmap reads the calendar at build time (packages/roadmap/src/calendar.ts), so a monthly
  # rebuild moves "today" and flags overdue stops without anyone editing the page.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/www typecheck
      - name: Build (static export)
        run: bun run www:build
        env:
          WWW_SITE_URL: https://sdods.com
          # Which desktop downloads the site offers. Linux only, because Linux is the one platform
          # that needs no code signing: there is no Gatekeeper and no SmartScreen, and the .deb and
          # AppImage install unsigned exactly as they always have. macOS and Windows stay hidden
          # until their certificates exist, since an unsigned build there is reported as malware.
          # Add them here as they are signed: `macos,linux`, then `all`.
          NEXT_PUBLIC_DESKTOP_PLATFORMS: linux
          # Maxi, the docs assistant (deploy/deploy-maxi.sh). A repository variable, so the chat stays
          # hidden until the service is live: an empty value renders no widget.
          NEXT_PUBLIC_MAXI_URL: ${{ vars.MAXI_URL }}
          # The community service (packages/community). Unset keeps the question and answer forms on
          # the old path (straight to Firestore as pending); set COMMUNITY_URL once the service is
          # deployed and the sign-in providers are enabled (the sdods-community skill).
          NEXT_PUBLIC_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          # Whether the source repository is public: shows the GitHub buttons, Discussions and
          # prefilled issue forms (apps/*/lib/links.ts). A repository variable, so making the repo
          # private again is `gh variable set REPO_PUBLIC --body false` and a rebuild, not a code change.
          NEXT_PUBLIC_REPO_PUBLIC: ${{ vars.REPO_PUBLIC }}
      - uses: actions/upload-artifact@v7
        with:
          name: www-site
          path: apps/www/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: www-site
          path: apps/www/out
      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: www
          channelId: live
      # previews.yml deletes the channel when the PR closes; `expires` is the backstop. The quota
      # gate below decides whether a failure here fails the job.
      - name: Deploy to Firebase Hosting (preview)
        id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: www
          channelId: pr-${{ github.event.number }}
          expires: 3d
      - name: Tolerate a full channel quota, and nothing else
        if: steps.preview.outcome == 'failure'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          SITE: sdods-automax
          CHANNEL: pr-${{ github.event.number }}
        run: bash scripts/preview-quota-gate.sh
