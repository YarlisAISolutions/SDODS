name: www

# Builds the landing site (apps/www) and deploys it to Firebase Hosting.
# - push to main → live channel at https://sdods.com and https://www.sdods.com
# - pull request  → temporary preview channel (URL posted on the PR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
  pull_request:
    paths:
      - 'apps/www/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/www typecheck
      - name: Build (static export)
        run: bun run www:build
        env:
          WWW_SITE_URL: https://sdods.com
          # Which desktop downloads the site offers. Linux only, because Linux is the one platform
          # that needs no code signing: there is no Gatekeeper and no SmartScreen, and the .deb and
          # AppImage install unsigned exactly as they always have. macOS and Windows stay hidden
          # until their certificates exist, since an unsigned build there is reported as malware.
          # Add them here as they are signed: `macos,linux`, then `all`.
          NEXT_PUBLIC_DESKTOP_PLATFORMS: linux
          # Maxi, the docs assistant (deploy/deploy-maxi.sh). A repository variable, so the chat stays
          # hidden until the service is live: an empty value renders no widget.
          NEXT_PUBLIC_MAXI_URL: ${{ vars.MAXI_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: www-site
          path: apps/www/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: www-site
          path: apps/www/out
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: www
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'live' }}
          expires: 7d
