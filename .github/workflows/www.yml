name: www

# Builds the landing site (apps/www) and deploys it to Firebase Hosting.
# - push to main → live channel at https://sdods.com and https://www.sdods.com
# - pull request  → temporary preview channel (URL posted on the PR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
  pull_request:
    paths:
      - 'apps/www/**'
      - 'packages/qa-archive/**'
      - 'scripts/build-qa-index.ts'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/www.yml'
      - 'scripts/preview-quota-gate.sh'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: www-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run --cwd apps/www typecheck
      - name: Build (static export)
        run: bun run www:build
        env:
          WWW_SITE_URL: https://sdods.com
          # Which desktop downloads the site offers.
          #   linux:   needs no signing (no Gatekeeper, no SmartScreen).
          #   windows: offered while unsigned, because SmartScreen lets the user through with
          #            "More info → Run anyway" and the download picker says so (it reads
          #            `signed` in lib/desktop-release.ts and drops the advice once the release is
          #            Authenticode-signed through Azure Artifact Signing). Only a release that
          #            passed desktop-install-smoke.yml should be linked here.
          #   macos:   offered while unsigned. macOS reports an unsigned, quarantined app as
          #            "damaged" with no Run-anyway button, so the picker shows the one Terminal
          #            command that clears it (xattr). The Apple Developer ID (YARLIS LLC) is in
          #            progress; `desktop:sync-release <tag> --signed=macos` switches the copy once a
          #            signed, notarized release exists.
          NEXT_PUBLIC_DESKTOP_PLATFORMS: macos,windows,linux
          # Maxi, the docs assistant (deploy/deploy-maxi.sh). A repository variable, so the chat stays
          # hidden until the service is live: an empty value renders no widget.
          NEXT_PUBLIC_MAXI_URL: ${{ vars.MAXI_URL }}
          # The community service (packages/community): the live questions, posting, votes and
          # feedback all go through it. Unset, the Q&A shows only the static archive.
          NEXT_PUBLIC_COMMUNITY_URL: ${{ vars.COMMUNITY_URL }}
          # sdods.com's sign-in (Firebase Auth), swapped in for @sdods/site-kit/identity-impl.
          # Unset, the site builds with no sign-in, as a fork does.
          SDODS_IDENTITY_MODULE: ./lib/firebase-identity.ts
          # Whether the source repository is public: shows the GitHub buttons, Discussions and
          # prefilled issue forms (apps/*/lib/links.ts). A repository variable, so making the repo
          # private again is `gh variable set REPO_PUBLIC --body false` and a rebuild, not a code change.
          NEXT_PUBLIC_REPO_PUBLIC: ${{ vars.REPO_PUBLIC }}
      - uses: actions/upload-artifact@v7
        with:
          name: www-site
          path: apps/www/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: www-site
          path: apps/www/out
      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: www
          channelId: live
      # previews.yml deletes the channel when the PR closes; `expires` is the backstop. The quota
      # gate below decides whether a failure here fails the job.
      - name: Deploy to Firebase Hosting (preview)
        id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          projectId: automax-docs
          target: www
          channelId: pr-${{ github.event.number }}
          expires: 3d
      - name: Tolerate a full channel quota, and nothing else
        if: steps.preview.outcome == 'failure'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMAX_DOCS }}
          SITE: sdods-automax
          CHANNEL: pr-${{ github.event.number }}
        run: bash scripts/preview-quota-gate.sh
