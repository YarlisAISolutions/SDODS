name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # nightly full matrix (UTC)

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  AUTOMAX_ENV: staging

jobs:
  lint-typecheck-unit:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - id: m
        shell: bash
        run: |
          # PRs and pushes: chromium only; nightly/manual: every browser declared in each project yaml.
          FULL=$(bun run --silent automax project list --json --matrix --shards 1)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MATRIX="$FULL"
          else
            MATRIX=$(echo "$FULL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s).filter(x=>x.browser==="chromium");console.log(JSON.stringify(m))})')
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  test:
    name: ${{ matrix.project }} · ${{ matrix.browser }} · ${{ matrix.shard }}/${{ matrix.total }}
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: API layer (no browser)
        if: matrix.browser == 'chromium'
        run: bun run automax run -p ${{ matrix.project }} -e staging -l api --run-id gh-${{ github.run_id }}-${{ matrix.project }}-api --no-ingest
      - name: UI layer · @smoke
        run: bun run automax run -p ${{ matrix.project }} -e staging -l ui -b ${{ matrix.browser }} -t @smoke --run-id gh-${{ github.run_id }}-${{ matrix.project }}-${{ matrix.browser }} --no-ingest
      - name: UI layer · @regression (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun run automax run -p ${{ matrix.project }} -e staging -l ui -b ${{ matrix.browser }} -t @regression --run-id gh-${{ github.run_id }}-${{ matrix.project }}-${{ matrix.browser }}-regression --no-ingest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automax-${{ matrix.project }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: .automax/runs
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: report · notify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: automax-*
          path: .automax/runs
          merge-multiple: true
      - name: Merge blob reports (when present)
        shell: bash
        run: |
          shopt -s nullglob
          blobs=(.automax/runs/*/blob-report)
          if [ ${#blobs[@]} -gt 0 ]; then
            npx playwright merge-reports --reporter html,junit "${blobs[@]}" || true
          else
            echo "no blob reports"
          fi
      - name: Notify GitHub (check runs, PR comment, issues)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          shopt -s nullglob
          for dir in .automax/runs/gh-${{ github.run_id }}-*; do
            id=$(basename "$dir")
            bun run automax integrations notify --run-id "$id" --from-files || echo "notify failed for $id"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automax-report
          path: |
            playwright-report
            .automax/runs/**/dashboard
          if-no-files-found: ignore
          retention-days: 30
