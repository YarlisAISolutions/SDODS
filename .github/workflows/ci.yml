name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # nightly: every browser, live sandboxes (no HAR)

permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  # NOTE: do not export SDODS_ENV globally — unit tests build fixture projects with their own envs.
  BUN_VERSION: '1.4.0'
  DEMO_ENV: staging
  RUN_ID: gh-${{ github.run_id }}

jobs:
  lint-typecheck-unit:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run lint
      # CLI e2e tests replay the committed HAR fixtures when CI is set (offline, deterministic).
      - run: bun run test

  web:
    name: web · build · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --filter @sdods/web build
      - run: cd packages/web && npx vitest run

  matrix:
    name: build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      live: ${{ steps.m.outputs.live }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - id: m
        shell: bash
        run: |
          # PRs and pushes: chromium only, 1 shard, offline (HAR replay).
          # Nightly / manual: every browser declared in each project yaml, 2 shards, live sandboxes.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW=$(bun run --silent sdods project list --json --matrix --shards 2)
            MODE=all
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            RAW=$(bun run --silent sdods project list --json --matrix --shards 1)
            MODE=chromium
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

          # `sdods project list --json` pretty-prints, and a multi-line value cannot be written as
          # `name=value` to $GITHUB_OUTPUT -- it fails with "Invalid format '  {'". Both branches
          # now compact to one line. Previously only the PR branch did, incidentally, by piping
          # through JSON.stringify to filter browsers, so the nightly matrix job failed every night
          # and the whole scheduled regression run never started.
          MATRIX=$(printf '%s' "$RAW" | MODE="$MODE" node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              let m = JSON.parse(s);
              if (process.env.MODE === "chromium") m = m.filter((x) => x.browser === "chromium");
              console.log(JSON.stringify(m));
            });')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  test:
    name: ${{ matrix.project }} · ${{ matrix.browser }} · ${{ matrix.shard }}/${{ matrix.total }}
    needs: [matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      # offline replay of the committed HAR fixtures unless this is the nightly live run
      HAR_FLAGS: ${{ needs.matrix.outputs.live == 'true' && '' || '--har-replay --strict' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: API layer (no browser)
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: >
          bun run sdods run -p ${{ matrix.project }} -e ${{ matrix.env }} -l api
          --run-id ${{ env.RUN_ID }}-${{ matrix.project }}-api --no-ingest $HAR_FLAGS
      - name: UI layer · @smoke
        run: >
          bun run sdods run -p ${{ matrix.project }} -e ${{ matrix.env }} -l ui -b ${{ matrix.browser }}
          -t @smoke --shard ${{ matrix.shard }}/${{ matrix.total }} --reporter blob
          --run-id ${{ env.RUN_ID }}-${{ matrix.project }}-${{ matrix.browser }} --no-ingest $HAR_FLAGS
      - name: UI layer · @regression (nightly, live)
        if: needs.matrix.outputs.live == 'true'
        run: >
          bun run sdods run -p ${{ matrix.project }} -e ${{ matrix.env }} -l ui -b ${{ matrix.browser }}
          -t @regression --shard ${{ matrix.shard }}/${{ matrix.total }} --reporter blob
          --run-id ${{ env.RUN_ID }}-${{ matrix.project }}-${{ matrix.browser }}-regression --no-ingest
      - name: Pack run artifacts (screenshots, api snapshots, meta) for ingest
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for dir in .sdods/runs/${RUN_ID}-*; do
            tar -czf "$dir/artifacts.tgz" -C "$dir" --exclude=artifacts.tgz --exclude=html-report --exclude=runner-output . || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdods-${{ matrix.project }}-${{ matrix.browser }}-${{ matrix.shard }}
          path: .sdods/runs
          retention-days: 14
          if-no-files-found: ignore

  dogfood:
    # SDODS tests its own web UI: builds the app, starts a scratch server, runs projects/sdods-web.
    # Excluded from the generic matrix via `ci.enabled: false` in its project yaml.
    name: dogfood · sdods-web · chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: bun run dogfood
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdods-dogfood
          path: .sdods/runs
          retention-days: 7
          if-no-files-found: ignore

  installer:
    # The one-line installers are the front door: they must keep working on every supported OS.
    # Linux and macOS run install.sh for real (clone + deps + shim + uninstall); Windows checks
    # that install.ps1 parses and that its dry run is honest.
    name: installer · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint the shell script
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            case "${{ runner.os }}" in
              Linux) sudo apt-get update -qq && sudo apt-get install -y shellcheck ;;
              macOS) brew install shellcheck ;;
            esac
          fi
          shellcheck --shell=sh --severity=warning installer/install.sh
      - name: Contract checks (help, version-check, dry run, uninstall guard)
        run: sh installer/install.sh --help && sh installer/install.sh --version-check
      # install.sh clones the repository over plain HTTPS. actions/checkout leaves an auth
      # header in the repo-local git config, so probe from a tmpdir to see what a stranger sees.
      - name: Is the repository publicly cloneable?
        id: reach
        run: |
          if (cd "${RUNNER_TEMP}" && git ls-remote --exit-code \
              "https://github.com/${{ github.repository }}.git" HEAD >/dev/null 2>&1); then
            echo 'public=true' >> "$GITHUB_OUTPUT"
          else
            echo 'public=false' >> "$GITHUB_OUTPUT"
            echo "::notice::Repository is private, so install.sh cannot clone it. Skipping the real install."
          fi
      - name: Install for real into a sandbox, then remove it
        if: steps.reach.outputs.public == 'true'
        run: |
          set -eu
          HOME_DIR="${RUNNER_TEMP}/sdods-home"
          BIN_DIR="${RUNNER_TEMP}/sdods-bin"
          sh installer/install.sh --dir "$HOME_DIR" --bin-dir "$BIN_DIR" \
            --browsers none --pm bun --source git --version main --yes
          "$BIN_DIR/sdods" --version
          (cd "$HOME_DIR/app" && "$BIN_DIR/sdods" project list)
          sh installer/install.sh --uninstall --dir "$HOME_DIR" --bin-dir "$BIN_DIR" --yes
          test ! -e "$HOME_DIR" && test ! -e "$BIN_DIR/sdods"

  installer-windows:
    name: installer · windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -Raw installer/install.ps1))
          Write-Host 'install.ps1 parses'
      - name: Help and dry run
        shell: pwsh
        run: |
          ./installer/install.ps1 -Help
          ./installer/install.ps1 -DryRun -Dir "$env:RUNNER_TEMP\amx" -BinDir "$env:RUNNER_TEMP\amx-bin" -Browsers none -Yes
          if (Test-Path "$env:RUNNER_TEMP\amx") { throw 'dry run wrote files' }

  report:
    name: report · ingest · notify
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: sdods-*
          path: .sdods/runs
          merge-multiple: true
      - name: Merge shard reports (sharded UI runs)
        shell: bash
        run: |
          shopt -s nullglob
          shards=(.sdods/runs/*/shard-reports)
          if [ ${#shards[@]} -gt 0 ]; then
            bun run sdods report merge --run "$RUN_ID" "${shards[@]}" || echo "merge failed"
          else
            echo "no shard reports"
          fi
      - name: Ingest into an SDODS server (when SDODS_SERVER_URL + SDODS_TOKEN secrets exist)
        if: always()
        shell: bash
        env:
          SDODS_SERVER_URL: ${{ secrets.SDODS_SERVER_URL }}
          SDODS_TOKEN: ${{ secrets.SDODS_TOKEN }}
        run: |
          if [ -z "$SDODS_SERVER_URL" ] || [ -z "$SDODS_TOKEN" ]; then
            echo "no server secrets; skipping ingest"; exit 0
          fi
          shopt -s nullglob
          for dir in .sdods/runs/${RUN_ID}-*; do
            id=$(basename "$dir")
            bun run sdods report ingest --run-id "$id" --server "$SDODS_SERVER_URL" --token "$SDODS_TOKEN" \
              "$dir"/run.json "$dir"/messages*.ndjson "$dir"/runner-results*.json "$dir"/artifacts.tgz || echo "ingest failed for $id"
          done
      - name: Notify GitHub (check runs, PR comment, issues) and Jira
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          shopt -s nullglob
          for dir in .sdods/runs/${RUN_ID}-*; do
            id=$(basename "$dir")
            bun run sdods integrations notify --run-id "$id" --from-files || echo "notify failed for $id"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdods-report
          path: |
            html-report
            .sdods/runs/**/dashboard
          if-no-files-found: ignore
          retention-days: 30
