name: api

# Builds the SDODS server image with Cloud Build and deploys it to Cloud Run (api.sdods.com).
# Needs the GCP_SA_KEY_AUTOMAX secret (service account github-deploy-api@automax-docs). Without it the
# workflow only validates the Dockerfile.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'projects/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT: automax-docs
  GCP_REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/automax-docs/sdods/automax-api

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: creds
        shell: bash
        # The key is multi-line JSON, so it goes through the environment; interpolating it
        # directly into the shell breaks the conditional.
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY_AUTOMAX }}
        run: |
          if [ -n "$SA_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Validate Dockerfile (no credentials)
        if: steps.creds.outputs.present != 'true'
        run: docker build -t automax-api:ci . >/dev/null && echo "Dockerfile builds; skipping deploy (no GCP_SA_KEY_AUTOMAX secret)"
      - uses: google-github-actions/auth@v2
        if: steps.creds.outputs.present == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_AUTOMAX }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.present == 'true'
      - name: Build image (Cloud Build)
        if: steps.creds.outputs.present == 'true'
        # Submitted async and polled, so the step's exit code reflects the build result.
        # Streaming instead makes a green build fail whenever gcloud cannot read the log bucket.
        run: |
          id=$(gcloud builds submit --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --tag "$IMAGE:${{ github.sha }}" --timeout=40m --machine-type=e2-highcpu-8 \
            --async --format='value(id)' .)
          echo "Cloud Build $id"
          echo "https://console.cloud.google.com/cloud-build/builds;region=$GCP_REGION/$id?project=$GCP_PROJECT"
          for _ in $(seq 1 160); do
            status=$(gcloud builds describe "$id" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status)')
            case "$status" in
              SUCCESS) echo "build succeeded"; exit 0 ;;
              FAILURE | TIMEOUT | CANCELLED | EXPIRED)
                echo "::error::Cloud Build $status - open the link above for the log"
                gcloud builds log "$id" --project "$GCP_PROJECT" --region "$GCP_REGION" | tail -60 || true
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for Cloud Build $id"
          exit 1
      - name: Tag latest
        if: steps.creds.outputs.present == 'true'
        run: gcloud artifacts docker tags add $IMAGE:${{ github.sha }} $IMAGE:latest
      - name: Deploy to Cloud Run
        if: steps.creds.outputs.present == 'true'
        run: bash deploy/deploy-cloud-run.sh ${{ github.sha }}
