name: desktop

# Builds the SDODS desktop app for macOS, Windows and Linux and attaches the installers to a
# GitHub Release.
#
# Tag-gated on purpose: six Electron builds, each bundling a ~120 MB Node runtime, is not a cost to
# pay on every pull request. Use workflow_dispatch to produce artifacts without cutting a release.
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the artifacts to a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.4.2'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform builds on its own runner. Cross-building is not an option: the Node
          # tarball's bin/npm and bin/npx are symlinks with shebangs and the node binary needs mode
          # 0755, both of which a foreign host loses.
          - { name: macos · arm64 + x64, os: macos-14, flags: --mac }
          - { name: windows · x64 + arm64, os: windows-latest, flags: --win }
          - { name: linux · x64 + arm64, os: ubuntu-latest, flags: --linux }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # The staged runtimes are large and version-pinned, so a cache hit skips ~250 MB of
      # downloads per runner. Keyed on the pinned version in fetch-node-runtime.ts.
      - name: Cache the bundled Node runtimes
        uses: actions/cache@v6
        with:
          path: apps/desktop/resources/node
          key: node-runtime-${{ runner.os }}-${{ hashFiles('apps/desktop/scripts/fetch-node-runtime.ts') }}

      - run: bun run --filter @sdods/desktop typecheck

      # Signing is wired behind these; every one is optional, so an unsigned build still succeeds.
      # See .claude/skills/code-signing/SKILL.md for how to obtain them, and for the
      # geographic restriction that decides which Windows route is even available to you.
      - name: Build installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: Developer ID Application certificate + notarization
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows, route A: Azure Artifact Signing (formerly Trusted Signing). No hardware
          # token, so it is the only option that works on a hosted runner without a self-hosted
          # box. The three secrets authenticate; the four repository *variables* below name the
          # account and profile, which are not secret and are needed to build azureSignOptions.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          # Windows, route B: a traditional OV certificate.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: bash
        run: |
          # An absent secret expands to an empty string, and an empty string is still *defined*.
          # electron-builder read CSC_LINK='' as "a certificate was supplied", tried to sign, and
          # died with "apps/desktop not a file". Unsetting the empties restores the intended
          # behaviour: sign when credentials exist, skip silently when they do not.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID \
                     AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                     WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            [ -z "${!var:-}" ] && unset "$var" || true
          done

          # The Apple credentials belong to the macOS runner only. electron-builder's Windows
          # signer resolves its certificate as WIN_CSC_LINK ?? CSC_LINK when azureSignOptions is
          # absent (app-builder-lib platformPackager.getCscLink), so a Windows build without Azure
          # would try to sign with the Developer ID .p12. electron.vite.config.ts also derives
          # __DESKTOP_SIGNED__ from CSC_LINK, which would compile Windows and Linux as "signed".
          if [ "${{ runner.os }}" != macOS ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi

          # azureSignOptions is passed on the command line, not written into electron-builder.yml:
          # once that block exists electron-builder always signs through Azure and fails without
          # credentials, which would break every local and fork build. Here it appears only when
          # the service principal does, so an unsigned build still succeeds.
          sign_args=()
          if [ "${{ runner.os }}" = Windows ] && [ -n "${AZURE_CLIENT_ID:-}" ]; then
            for var in AZURE_TENANT_ID AZURE_CLIENT_SECRET AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT \
                       AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER; do
              if [ -z "${!var:-}" ]; then
                echo "::error::AZURE_CLIENT_ID is set but $var is not; see .claude/skills/code-signing/SKILL.md"
                exit 1
              fi
            done
            sign_args=(
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGN_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGN_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
              "-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER"
            )
            echo "Windows signing: Azure Artifact Signing ($AZURE_SIGN_ACCOUNT/$AZURE_SIGN_PROFILE)"
          fi

          bun run build

          # electron-builder downloads the Electron binary and the app-builder helpers at pack
          # time, and a single transient 5xx from that CDN fails the whole release. One run died
          # on "Response code 504 (Gateway Time-out)" with nothing wrong in the repo. Retry a few
          # times before giving up; packing is idempotent, so a second attempt is safe.
          for attempt in 1 2 3; do
            # --publish never: releasing is a separate, explicit step below.
            if npx electron-builder ${{ matrix.flags }} "${sign_args[@]}" --publish never; then
              exit 0
            fi
            echo "::warning::electron-builder attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error::electron-builder failed three times"
          exit 1

      # Prove the artifact is not hollow. A missing extraResources source is only a warning in
      # electron-builder, and it once produced a .dmg with no Node runtime and a zero exit code.
      #
      # npm is checked as well as node, and that is not belt-and-braces: app-builder-lib's copy
      # filter silently drops a `node_modules` directory that sits at the root of a copy, which is
      # exactly where Node puts npm on Windows (`node_modules/npm`) and nowhere else
      # (`lib/node_modules/npm`). Every Windows installer for 0.1.0 therefore shipped without npm
      # and could not run its own first-run install, while this step reported "ok". Checking only
      # the thing that broke last time is how the next hollow artifact gets published.
      - name: Verify each app bundles its Node runtime, npm and update feed
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for dir in release/*/; do
            case "$dir" in
              *mac*) exe="$dir"SDODS.app/Contents/Resources/node/bin/node
                     npm="$dir"SDODS.app/Contents/Resources/node/lib/node_modules/npm/bin/npm-cli.js ;;
              *win*) exe="$dir"resources/node/node.exe
                     npm="$dir"resources/node/node_modules/npm/bin/npm-cli.js ;;
              *linux*) exe="$dir"resources/node/bin/node
                     npm="$dir"resources/node/lib/node_modules/npm/bin/npm-cli.js ;;
              *) continue ;;
            esac
            if [ ! -f "$exe" ]; then
              echo "FAIL $dir has no bundled Node at $exe"
              exit 1
            fi
            if [ ! -f "$npm" ]; then
              echo "FAIL $dir bundles Node but no npm at $npm"
              echo "     first-run cannot install @sdods/cli without it"
              exit 1
            fi
            # electron-updater reads this feed. It once named the source repository, private at
            # the time, where every release asset 404'd, so an installed app could never update.
            case "$dir" in
              *mac*) feed="$dir"SDODS.app/Contents/Resources/app-update.yml ;;
              *)     feed="$dir"resources/app-update.yml ;;
            esac
            if ! grep -q '^repo: sdods-releases$' "$feed" 2>/dev/null; then
              echo "FAIL $dir has no app-update.yml pointing at sdods-releases ($feed)"
              cat "$feed" 2>/dev/null || true
              exit 1
            fi
            echo "ok   $dir (node + npm + update feed)"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo 'no packaged app directories found'; exit 1; }

      # When signing credentials exist, an unsigned installer is a failed build, not a quiet
      # fallback: winget's validation and SmartScreen both key on this signature (#169).
      - name: Verify the Windows installers are signed
        if: runner.os == 'Windows'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        working-directory: apps/desktop
        shell: pwsh
        run: |
          # Checked here, not in `if:`: a step's own env is not visible to its condition.
          if (-not $env:AZURE_CLIENT_ID) { 'No signing credentials; this build is unsigned.'; exit 0 }
          $files = @(Get-ChildItem release/*.exe) + @(Get-ChildItem release/win-*/SDODS.exe)
          if ($files.Count -eq 0) { throw 'no Windows executables found' }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "{0,-8} {1}  {2}" -f $sig.Status, $f.Name, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { throw "$bad executable(s) are not validly signed" }

      # What actually came out signed, per platform, for the release body. Read from the artifacts,
      # not from which secrets exist: credentials that are present but produced no signature (a
      # skipped notarization, a half-configured Azure) must not be advertised as signed. It is
      # uploaded as its own artifact, named outside the sdods-desktop-* pattern, so it is never
      # attached to the release.
      - name: Record what was signed
        if: runner.os != 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../signing
          status=signed
          if [ "${{ runner.os }}" = macOS ]; then
            platform=macos
            for app in release/mac*/SDODS.app; do
              # A Developer ID signature alone is not enough: Gatekeeper wants the notarization.
              out=$(spctl --assess --type execute -vv "$app" 2>&1 || true)
              echo "$app: $out"
              grep -q 'source=Notarized Developer ID' <<<"$out" || status=unsigned
            done
          else
            platform=windows
            for exe in release/*.exe release/win-*/SDODS.exe; do
              sig=$(pwsh -NoProfile -Command "(Get-AuthenticodeSignature '$exe').Status")
              echo "$exe: $sig"
              [ "$sig" = Valid ] || status=unsigned
            done
          fi
          echo "$status" > "../../signing/$platform"
          echo "$platform: $status"

      - uses: actions/upload-artifact@v7
        if: runner.os != 'Linux'
        with:
          name: sdods-signing-${{ runner.os }}
          path: signing/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: sdods-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # Runs alongside `release`, not before it: the draft is created immediately either way, and
  # whoever publishes it reads this job's summary first. Blocking the upload on a 25-minute
  # analysis would buy nothing, because a person is the gate regardless.
  scan:
    name: virustotal
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          pattern: sdods-desktop-*
          path: artifacts
          merge-multiple: true

      # Optional, like the signing credentials: with no key the script prints one line and exits 0,
      # so a fork or an unconfigured repo still releases. Detections never fail the job -- see the
      # script for why a detection threshold would be the wrong gate.
      - name: Scan the installers
        working-directory: apps/desktop
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(../../artifacts/*.dmg ../../artifacts/*.zip ../../artifacts/*.exe \
                 ../../artifacts/*.AppImage ../../artifacts/*.deb)
          node --import tsx scripts/virustotal-scan.ts "${files[@]}"

  release:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sdods-desktop-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: sdods-signing-*
          path: signing
          merge-multiple: true

      # Says what is true of *these* installers. A fixed "these builds are unsigned" paragraph went
      # wrong the moment one platform was signed and the other was not.
      - name: Write the release notes
        run: |
          set -euo pipefail
          mac=$(cat signing/macos)
          win=$(cat signing/windows)
          {
            echo 'SDODS desktop — installs, launches and upgrades SDODS in one click.'
            echo
            echo 'Verify your download against `SHA256SUMS.txt`:'
            echo
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
            echo
            if [ "$mac" = unsigned ] && [ "$win" = unsigned ]; then
              echo '**These builds are unsigned.** Until certificates are in place:'
            elif [ "$mac" = unsigned ] || [ "$win" = unsigned ]; then
              echo '**Not every build is signed yet.** Per platform:'
            else
              echo '**The macOS and Windows builds are signed.**'
            fi
            if [ "$mac" = signed ]; then
              echo '- macOS: signed with a Developer ID and notarized by Apple — open it normally'
            else
              echo '- macOS: right-click the app → Open (Gatekeeper blocks a plain double-click)'
            fi
            if [ "$win" = signed ]; then
              # Signing names the publisher; SmartScreen reputation still builds per release.
              echo '- Windows: Authenticode-signed. If SmartScreen still warns on a new release, check it names SDODS as the publisher, then More info → Run anyway'
            else
              echo '- Windows: More info → Run anyway (SmartScreen)'
            fi
            echo '- Linux: AppImage and .deb install normally'
          } > release-notes.md
          cat release-notes.md

      # Unsigned builds make this more than a formality: a checksum is the only way a user can
      # confirm the installer they downloaded is the one that was built.
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          set -euo pipefail
          rm -f SHA256SUMS.txt
          # Only user-facing installers; blockmaps and latest*.yml are updater plumbing.
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Published to a PUBLIC releases-only repository, because YarlisAISolutions/SDODS is private
      # (public only from 2026-09-26 to 2026-09-28) and a private repo's release assets 404 for
      # visitors. The split would stay even with a public source repo: installed apps, the apt
      # repository, Homebrew and Scoop already point there, and one releases-only repository keeps
      # the download page's asset list clean.
      #
      # Requires a DESKTOP_RELEASE_TOKEN secret: a fine-grained PAT with Contents: read+write on
      # the releases repo only. GITHUB_TOKEN cannot write to another repository.
      - name: Attach the installers to the public release
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ vars.DESKTOP_RELEASE_REPO || 'YarlisAISolutions/sdods-releases' }}
          token: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          # A draft first: the download page on sdods.com points at these filenames, so a person
          # checks the release before anyone can download a broken installer.
          files: artifacts/*
          body_path: release-notes.md
