name: apt repository

# Builds a signed apt repository from a published desktop release and opens a PR with its metadata,
# which sdods.com then serves.
#
# The .deb files are not published here and cannot be: they are 120-130 MB each, over GitHub's
# 100 MB per-file limit, so no branch in any repository can hold them. They stay on the public
# release, `Packages` records them under `pool/<tag>/`, and firebase.json redirects that path to
# the release asset. apt follows the redirect and verifies the download against the SHA-256 in
# `Packages`, so nothing is trusted less for having been fetched from somewhere else.
#
# What gets committed is a few kilobytes of metadata, and only when a desktop release is cut.
#
# Deliberately manual. Adding an apt source is a trust decision by the person running apt, and the
# repository is signed with the project key — so a person triggers it, the same way a person
# publishes the release it packages.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'desktop-v* tag to package (default: the newest published one)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    name: build · sign · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The key is the whole security model: without it apt has no reason to trust these bytes, and
      # an unsigned repo is one a user can only add with [trusted=yes], which disables the check
      # for everything else they install too.
      - name: Require the signing key
        env:
          KEY: ${{ secrets.SDODS_APT_GPG_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::SDODS_APT_GPG_KEY is not set. Generate the project signing key, add it" \
                 "as a repository secret (armoured private key), then run this again."
            exit 1
          fi

      - name: Download the .deb files from the release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ vars.DESKTOP_RELEASE_REPO || 'siri1410/sdods-releases' }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p debs
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$RELEASE_REPO" --exclude-drafts --limit 30 \
                  --json tagName --jq '[.[] | select(.tagName | startswith("desktop-v"))][0].tagName')
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || {
            echo "::error::No published desktop-v* release in $RELEASE_REPO."; exit 1; }
          echo "packaging $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "$RELEASE_REPO" -p '*.deb' -D debs
          ls -la debs

      - name: Build and sign the repository
        env:
          SDODS_APT_GPG_KEY: ${{ secrets.SDODS_APT_GPG_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils
          # The pool path carries the tag so one redirect rule serves every release.
          packaging/apt/build-repo.sh debs site/apt "pool/$TAG"

      # A local proof before anyone's machine trusts it: apt resolves the package from the repo as
      # written, using the keyring the repo itself ships. A repo that only "looks right" has passed
      # this check zero times.
      - name: Verify apt can read it
        run: |
          set -euo pipefail
          sudo cp site/apt/sdods-archive-keyring.gpg /usr/share/keyrings/
          # Trailing `./` is what addresses a flat repository. With `stable main` apt looks for
          # dists/stable/main/binary-amd64/Packages, which a flat repo does not have.
          echo "deb [signed-by=/usr/share/keyrings/sdods-archive-keyring.gpg] file://$PWD/site/apt ./" \
            | sudo tee /etc/apt/sources.list.d/sdods-local.list
          sudo apt-get update -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/sdods-local.list \
                              -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          apt-cache policy sdods
          apt-cache policy sdods | grep -q 'Candidate: [0-9]' || {
            echo "::error::apt found the repository but no installable sdods package."; exit 1; }
          # Stronger than reading the metadata: this fetches the .deb through the repository and
          # checks it against the SHA-256 in Packages. If the two ever disagree, apt says so here
          # rather than on a user's machine.
          sudo apt-get install -y --download-only sdods

      - name: Open a PR with the metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The payload is deleted now, not skipped earlier: the metadata above records each file's
          # size and SHA-256, and the verify step needed the real bytes to check them against.
          find site/apt -name '*.deb' -delete
          rm -rf apps/www/public/apt
          mkdir -p apps/www/public
          cp -r site/apt apps/www/public/apt
          du -sh apps/www/public/apt

          branch="chore/apt-$TAG"
          git config user.name 'SDODS'
          git config user.email 'admin@sdods.com'
          git checkout -b "$branch"
          git add apps/www/public/apt
          git diff --quiet --cached && { echo 'apt metadata unchanged'; exit 0; }
          git commit -m "chore(apt): repository metadata for $TAG"
          git push -u origin "$branch"
          gh pr create --fill --base main --head "$branch" \
            --title "chore(apt): repository metadata for $TAG" \
            --body "Signed apt repository metadata for \`$TAG\`, built and verified by the apt workflow.

          The \`.deb\` files are not here — they are over GitHub's 100 MB file limit and stay on the
          public release. \`Packages\` points at \`pool/$TAG/\`, which firebase.json redirects to the
          release asset; apt verifies the download against the SHA-256 recorded here.

          Merging this deploys the repository to https://sdods.com/apt."
