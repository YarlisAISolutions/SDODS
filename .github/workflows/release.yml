name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    name: version · publish (npm)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 22 still bundles npm 10. With
      # `id-token: write` above, npm uses OIDC automatically for packages configured for it on
      # npmjs.com, and falls back to NPM_TOKEN otherwise.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: bun run typecheck && bun run test
      # Publishing needs either an NPM_TOKEN secret or trusted publishing (OIDC) configured for
      # the packages on npmjs.com — set the repository variable NPM_TRUSTED_PUBLISHING=true once
      # that is in place. Without either the workflow still succeeds, with nothing to publish.
      # npm is deprecating direct publishing from 2FA-bypass tokens (~Jan 2027), so OIDC is the
      # path that lasts: https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
      - name: Check publish credentials
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ -n "$NPM_TOKEN" ] || [ "$TRUSTED" = 'true' ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no NPM_TOKEN and NPM_TRUSTED_PUBLISHING is not true — skipping publish"
          fi
      - name: Create release PR or publish
        if: steps.creds.outputs.present == 'true'
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          # Not `changeset publish`: it packs each package directory as-is, and npm does not apply
          # `publishConfig` field overrides (a pnpm/yarn feature), so the tarballs would ship
          # `exports` pointing at src/*.ts that `files: ["dist"]` excludes. scripts/publish-npm.sh
          # stages the manifests and the init/dashboard assets first — same path a human uses.
          publish: bash scripts/publish-npm.sh
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: server image (GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sdods-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
