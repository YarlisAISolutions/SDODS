# Workspace file: the organization this repo belongs to and the workspaces it contains.
# Hierarchy: organization → workspace → project (projects/<slug>, `workspace:` field) → module (features/<module>).
# Roles: organization owner/admin/member; workspace admin/editor/viewer (see docs → Security).
organization:
  slug: sdods
  name: SDODS
  description: Default organization created by `sdods init`.
  url: https://github.com/YarlisAISolutions/SDODS

workspaces:
  - slug: default
    name: Default workspace
    description: Holds the demo project. Create more workspaces for other teams or products.
    organization: sdods
  - slug: platform-qa
    name: Platform QA
    description: 'Example second workspace; projects opt in with workspace: platform-qa.'
    organization: sdods

defaultWorkspace: default

defaults:
  browsers: [chromium, firefox, webkit]
  suites: [smoke, regression, sanity]
  testIdAttribute: data-testid
  # Workspace-level processes apply to every project unless the project overrides the same name.
  processes:
    - name: pr-check
      title: Pull request check
      trigger: pr
      tags: '@smoke'
      browsers: [chromium]
      harMode: replay
      gates: { minPassRate: 100 }
    - name: nightly-regression
      title: Nightly regression
      trigger: nightly
      tags: '@regression'
      browsers: [chromium, firefox, webkit]
      notify: [github]
      schedule: '0 2 * * *'
    - name: release-gate
      title: Release gate
      trigger: release
      tags: '@smoke or @regression'
      failOnFlaky: true
      gates: { minPassRate: 100, maxFlaky: 0, perfBudgets: true, a11y: true }
