<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-labelledby="t d">
  <title id="t">SDODS</title>
  <desc id="d">SDODS lockup: the name sits inside an aperture formed by two mirrored gates, with a cored ring standing in for the centre O.</desc>
  <style>
    .ink  { fill: currentColor; }
    .rule { stroke: currentColor; }
    .core { fill: #FFB020; }
    .tag  { fill: currentColor; opacity: .62; }
  </style>
  <g transform="translate(30,0)">
    <!-- The gate, opened out to hold the word. Tighter than the first pass: the arcs sit closer
         to the letters so the lockup reads as one object rather than text inside decoration. -->
    <g fill="none" stroke-linecap="round" stroke-width="10">
      <path class="rule" d="M28 26 A 58 58 0 0 0 28 110"/>
      <path class="rule" d="M446 26 A 58 58 0 0 1 446 110"/>
    </g>
    <text class="ink" x="62" y="94" font-family="'Space Grotesk','Avenir Next','Futura','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="76" font-weight="700" letter-spacing="10">SD</text>
    <!-- the centre O: one ring, one core. A single unambiguous letterform. -->
    <g transform="translate(237,68)" fill="none">
      <circle class="rule" cx="0" cy="0" r="21" stroke-width="10"/>
      <circle class="core" cx="0" cy="0" r="7" stroke="none"/>
    </g>
    <text class="ink" x="272" y="94" font-family="'Space Grotesk','Avenir Next','Futura','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="76" font-weight="700" letter-spacing="10">DS</text>
    <text class="tag" x="64" y="129" font-family="'Space Grotesk','Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="16" font-weight="500" letter-spacing="3.1">Test automation you can defend.</text>
  </g>
</svg>
