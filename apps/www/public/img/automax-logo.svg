<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="t d">
  <title id="t">AutoMax</title>
  <desc id="d">AutoMax logo: a hexagonal play mark with a check, next to the wordmark AutoMax.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- mark: hexagon (Playwright-style stage) with a play triangle and a check tick -->
  <g transform="translate(20,10)">
    <polygon points="70,0 130,35 130,105 70,140 10,105 10,35" fill="url(#g)"/>
    <polygon points="52,38 52,102 104,70" fill="#FFFFFF" opacity="0.95"/>
    <path d="M86 92 l12 12 l24 -28" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- wordmark -->
  <g transform="translate(175,0)">
    <text x="0" y="102" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#w)" letter-spacing="-2">Auto<tspan fill="#6366F1">Max</tspan></text>
    <text x="4" y="138" font-family="Inter, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#475569" letter-spacing="4">PLAYWRIGHT · BDD · API · UI · AGENTS</text>
  </g>
</svg>
