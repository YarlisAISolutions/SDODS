appId: com.sdods.desktop
productName: SDODS
copyright: Copyright © 2026 SDODS

directories:
  output: release
  buildResources: build

asar: true

# Guarantees the bundled Node exists for the arch being packed. A missing extraResources source is
# only a warning, which once produced an x64 .dmg with no runtime in it and a zero exit code.
beforePack: scripts/before-pack.mjs

# Turns the macOS bundle's broken placeholder signature into a valid ad-hoc one, so an unsigned
# download reports "unidentified developer" rather than "damaged". Runs before electron-builder's
# own signing step, so real Developer ID credentials still win. See the hook for the full story.
afterPack: scripts/after-pack.mjs

files:
  - out/**
  - package.json
  - '!**/*.map'
  # apps/desktop declares no production dependencies -- everything is bundled by rollup -- because
  # electron-builder's dependency collector has no handling for bun's node_modules/.bun symlink
  # layout. Excluding node_modules outright makes that explicit rather than accidental.
  - '!node_modules/**'

# Nothing native runs inside the Electron process: the server is a child of the bundled Node, so
# better-sqlite3 and argon2 load against Node's ABI and never need an Electron rebuild.
npmRebuild: false
nodeGypRebuild: false

# `extraResources` does NOT merge between the top level and a platform block -- a platform array
# replaces it. So each platform repeats its own entry, using ${arch} to pick the matching runtime.
mac:
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The staged Node is a second executable inside the bundle and must be signed explicitly.
  binaries:
    - Contents/Resources/node/bin/node
  extendInfo:
    # The child processes download browsers and npm packages; quarantining them would make every
    # spawned binary trip Gatekeeper.
    LSFileQuarantineEnabled: false
  extraResources:
    - from: resources/node/darwin-${arch}
      to: node
      filter: ['**/*']
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip is what electron-updater consumes on macOS; dmg alone cannot auto-update.
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# One naming scheme for every artifact: <product>-<version>-<platform>-<arch>.<ext>.
# electron-builder's defaults omit the platform on macOS ("SDODS-0.1.0-arm64.dmg" could be a Linux
# build) and the arch on the mac zip. In a release listing that mixes six files, every one has to
# say what it is without the surrounding context.
artifactName: ${productName}-${version}-${platform}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  extraResources:
    - from: resources/node/win32-${arch}
      to: node
      filter: ['**/*']
    # npm has to be copied as its own entry. app-builder-lib's copy filter drops a directory named
    # `node_modules` when it sits at the ROOT of a copy (util/filter.js: `if (relative ===
    # "node_modules") return false`), and no pattern can override it -- the check runs before the
    # patterns do. Node ships npm at `node_modules/npm` on Windows but at `lib/node_modules/npm`
    # everywhere else, so this silently stripped npm from the Windows builds only, and first-run
    # died in `npmCli()` with "Could not locate npm". Making node_modules the copy root means the
    # rule has nothing to match.
    - from: resources/node/win32-${arch}/node_modules
      to: node/node_modules
      filter: ['**/*']
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SDODS
  # The workspace and its SQLite database live outside the install dir, but be explicit: an
  # uninstall must never take the user's tests with it.
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}

linux:
  # electron-builder derives the Linux executable name from package.json `name`, which here is the
  # scoped `@sdods/desktop`. Stripped of its slash that becomes `@sdodsdesktop`, which it then
  # rejects as unsafe for a file path — so the AppImage and deb targets cannot build without this.
  #
  # It lives under `linux:` and not at the top level because `executableName` is NOT Linux-only:
  # at the top level it also renamed the macOS bundle to `sdods.app` and the Windows binary to
  # `sdods.exe`. That shipped a lowercase app in Finder and made the download page's
  # `xattr -dr com.apple.quarantine /Applications/SDODS.app` wrong on case-sensitive volumes.
  executableName: sdods
  category: Development
  maintainer: SDODS <admin@sdods.com>
  synopsis: BDD test automation for UI, API and hybrid flows
  description: >-
    SDODS runs BDD test suites across UI, API and hybrid layers, with self-healing locators,
    data-driven scenarios and a local results dashboard. The desktop app bundles a Node runtime
    and manages the SDODS workspace, server and Playwright browsers for you.
  desktop:
    entry:
      StartupWMClass: SDODS
  extraResources:
    - from: resources/node/linux-${arch}
      to: node
      filter: ['**/*']
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  target:
    # x64 only, deliberately. The ARM64 AppImageKit runtime electron-builder embeds declares
    # `NEEDED: libz.so` -- the zlib1g-dev symlink -- rather than `libz.so.1`, so it dies with
    # "error while loading shared libraries: libz.so" on any stock distro, before a single line of
    # our code runs. The x86_64 runtime declares libz.so.1 and is fine. Building it anyway would
    # only put a download that cannot start back on the page, since `desktop:sync-release` lists
    # whatever the release contains. ARM64 Linux users take the .deb, which is verified working.
    # Restore this when the static `type2-runtime` (statically links libfuse3, no libz issue) can
    # be substituted for the bundled one.
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64, arm64]

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    # Electron safeStorage encrypts the stored credentials through libsecret.
    - libsecret-1-0
    # Electron links libasound.so.2 and nothing else in this list pulls it in, so `apt install`
    # reported success and the app then failed to start on any host without ALSA. Ubuntu 24.04
    # renamed the package to libasound2t64 (the 64-bit time_t transition) and left `libasound2`
    # as a virtual name with two providers, which apt refuses to resolve on its own -- hence the
    # alternation rather than a bare `libasound2`: real package first, Debian's name second.
    - libasound2t64 | libasound2

# This block is what electron-builder writes into the packaged `Resources/app-update.yml`, which is
# the feed electron-updater (src/main/updater.ts) reads. It names the PUBLIC releases repository, where
# every installed app already looks. It began there because YarlisAISolutions/SDODS was private and
# a private repo's release assets 404; the source is public now, but moving the feed would strand
# every installed copy on its current version. Uploading is not done from here -- desktop.yml packs with
# `--publish never` and attaches the artifacts itself -- so this only decides where installed apps
# look.
#
# The updater is dormant on macOS until the build is Developer ID signed (Squirrel.Mac refuses an
# unsigned update), and on .deb installs, which apt keeps current.
publish:
  provider: github
  owner: YarlisAISolutions
  repo: sdods-releases
  releaseType: release
